AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PlainTerms API

Parameters:
  AppBaseUrl:
    Type: String
    Default: https://www.plainterms.us
    Description: Frontend base URL used for Stripe success/cancel redirects.
  AppSecondaryBaseUrl:
    Type: String
    Default: https://plainterms.us
    Description: Additional frontend origin allowed for CORS and uploads (for apex/www support).
  StripeSecretKeyParamName:
    Type: String
    Default: /plainterms/stripe/secret-key
    Description: SSM parameter name containing Stripe secret key (SecureString).
  StripeTestSecretKeyParamName:
    Type: String
    Default: /plainterms/stripe/test/secret-key
    Description: SSM parameter name containing Stripe sandbox/test secret key (SecureString).
  StripePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: Legacy fallback SSM parameter name containing Stripe price ID (String).
  StripeReportPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe report tier price ID (String).
  StripeScanPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe scan tier price ID (String).
  StripeProtectPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe protect tier price ID (String).
  StripeAddonRewritePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe add-on price ID for rewrite contract (String).
  StripeAddonUpdateEmailPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe add-on price ID for update email draft (String).
  StripeTestReportPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/test/price-id-report
    Description: SSM parameter name containing Stripe sandbox/test report tier price ID (String).
  StripeTestScanPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/test/price-id-scan
    Description: SSM parameter name containing Stripe sandbox/test scan tier price ID (String).
  StripeTestProtectPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/test/price-id-protect
    Description: SSM parameter name containing Stripe sandbox/test protect tier price ID (String).
  StripeTestAddonRewritePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/test/price-id-addon-rewrite
    Description: SSM parameter name containing Stripe sandbox/test add-on price ID for rewrite contract (String).
  StripeTestAddonUpdateEmailPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/test/price-id-addon-update-email
    Description: SSM parameter name containing Stripe sandbox/test add-on price ID for update email draft (String).
  StripeMode:
    Type: String
    Default: live
    AllowedValues:
      - live
      - sandbox
    Description: Stripe environment mode. Use sandbox for test keys and test price IDs.
  AnalysisMode:
    Type: String
    Default: rules
    AllowedValues:
      - rules
      - llm
    Description: Contract analysis mode.
  LlmModel:
    Type: String
    Default: gpt-4o-mini
    AllowedValues:
      - gpt-4o-mini
      - gpt-5-mini
      - gpt-5
      - gpt-5.2
    Description: LLM model to use when AnalysisMode is llm.
  LlmApiKeyParamName:
    Type: String
    Default: /plainterms/llm/api-key
    Description: SSM parameter name containing LLM API key (SecureString).
  PrecheckTokenSecretParamName:
    Type: String
    Default: /plainterms/precheck/token-secret
    Description: SSM parameter name used to sign/verify precheck tokens (SecureString).
  EnableApiWaf:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Toggle API WAF on/off. Keep false to reduce monthly cost, set true to enable WAF protection.
  WafGlobalIpLimitPer5Min:
    Type: Number
    Default: 1500
    Description: WAF IP-based rate limit over a 5-minute window when WAF is enabled.
  ApiDefaultRateLimit:
    Type: Number
    Default: 5
    Description: Stage-level steady-state API Gateway throttle rate limit (requests/sec).
  ApiDefaultBurstLimit:
    Type: Number
    Default: 10
    Description: Stage-level API Gateway throttle burst limit.
  FeedbackRateLimit:
    Type: Number
    Default: 2
    Description: Dedicated throttle rate (requests/sec) for POST /feedback. Its own token bucket, so feedback spam can't drain the shared API budget.
  FeedbackBurstLimit:
    Type: Number
    Default: 5
    Description: Dedicated throttle burst limit for POST /feedback.
  PreviewMaxConcurrency:
    Type: Number
    Default: 0
    Description: Reserved concurrency cap for the free preview analysis function. Set to 0 to disable reservation (required when the account concurrency limit is 10, since AWS requires 10 unreserved). Raise only after requesting a Lambda concurrency limit increase.
  ApiRequestCountAlarmThreshold:
    Type: Number
    Default: 900
    Description: Alarm threshold for API request count per period.
  Api4xxAlarmThreshold:
    Type: Number
    Default: 60
    Description: Alarm threshold for total 4XX responses per period.
  Api5xxAlarmThreshold:
    Type: Number
    Default: 10
    Description: Alarm threshold for total 5XX responses per period.
  ApiAlarmPeriodSeconds:
    Type: Number
    Default: 300
    Description: CloudWatch alarm period for API alarms in seconds.
  ApiAlarmEvaluationPeriods:
    Type: Number
    Default: 1
    Description: Number of periods to evaluate for API alarms.
  ApiAlarmSnsTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for alarm notifications. Leave empty to use the built-in alerts topic.
  AlertsEmail:
    Type: String
    Default: "plaintermsinfo@gmail.com"
    Description: Email address to receive CloudWatch alarm notifications.
  ResendApiKeyParamName:
    Type: String
    Default: /plainterms/resend/api-key
    Description: SSM parameter name containing Resend API key for transactional email (SecureString). Leave unset to disable receipt emails.

Conditions:
  EnableApiWafCondition: !Equals [!Ref EnableApiWaf, "true"]
  EnablePreviewReservedConcurrencyCondition: !Not [!Equals [!Ref PreviewMaxConcurrency, 0]]
  HasApiAlarmSnsTopic: !Not [!Equals [!Ref ApiAlarmSnsTopicArn, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AppBaseUrl
        ALLOWED_ORIGINS: !Sub "${AppBaseUrl},${AppSecondaryBaseUrl},https://plainterms.vercel.app,http://localhost:3000,https://plainterms-*.vercel.app"

Resources:
  PlainTermsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-plainterms-api"
      StageName: Prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: !Sub "'${AppBaseUrl}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ApiDefaultRateLimit
          ThrottlingBurstLimit: !Ref ApiDefaultBurstLimit
        # More-specific override: POST /feedback gets its own tighter bucket.
        - ResourcePath: "/feedback"
          HttpMethod: "POST"
          ThrottlingRateLimit: !Ref FeedbackRateLimit
          ThrottlingBurstLimit: !Ref FeedbackBurstLimit

  PlainTermsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertsEmail

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AppBaseUrl
              - !Ref AppSecondaryBaseUrl
              - https://plainterms.vercel.app
              - http://localhost:3000
              - https://plainterms-*.vercel.app
            AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 30

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub arn:aws:s3:::${UploadBucket}
              - !Sub arn:aws:s3:::${UploadBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsFeedback
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: result_id
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: result_id
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE

  TestimonialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsTestimonials
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: testimonial_id
          AttributeType: S
      KeySchema:
        - AttributeName: testimonial_id
          KeyType: HASH

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsResults
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: result_id
          AttributeType: S
      KeySchema:
        - AttributeName: result_id
          KeyType: HASH

  PlainTermsApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: EnableApiWafCondition
    Properties:
      Name: !Sub "${AWS::StackName}-plainterms-api-webacl"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-plainterms-api-webacl"
        SampledRequestsEnabled: true
      Rules:
        - Name: ip-rate-limit-global
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref WafGlobalIpLimitPer5Min
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-ip-rate-limit-global"
            SampledRequestsEnabled: true

  PlainTermsApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: EnableApiWafCondition
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${PlainTermsApi}/stages/Prod
      WebACLArn: !GetAtt PlainTermsApiWebAcl.Arn

  PlainTermsApiRequestCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "High API request volume for ${AWS::StackName} (${PlainTermsApi})."
      Namespace: AWS/ApiGateway
      MetricName: Count
      Statistic: Sum
      Period: !Ref ApiAlarmPeriodSeconds
      EvaluationPeriods: !Ref ApiAlarmEvaluationPeriods
      Threshold: !Ref ApiRequestCountAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-plainterms-api"
        - Name: Stage
          Value: Prod
      AlarmActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]
      OKActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]

  PlainTermsApi4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Elevated 4XX responses for ${AWS::StackName} (${PlainTermsApi})."
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Statistic: Sum
      Period: !Ref ApiAlarmPeriodSeconds
      EvaluationPeriods: !Ref ApiAlarmEvaluationPeriods
      Threshold: !Ref Api4xxAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-plainterms-api"
        - Name: Stage
          Value: Prod
      AlarmActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]
      OKActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]

  PlainTermsApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Elevated 5XX responses for ${AWS::StackName} (${PlainTermsApi})."
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Statistic: Sum
      Period: !Ref ApiAlarmPeriodSeconds
      EvaluationPeriods: !Ref ApiAlarmEvaluationPeriods
      Threshold: !Ref Api5xxAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-plainterms-api"
        - Name: Stage
          Value: Prod
      AlarmActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]
      OKActions:
        - !If [HasApiAlarmSnsTopic, !Ref ApiAlarmSnsTopicArn, !Ref PlainTermsAlertsTopic]

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: uploadUrl.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrlPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: POST
        UploadUrlOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: OPTIONS

  PrecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: precheckUpload.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          PRECHECK_MIN_WORDS: "5"
          PRECHECK_TOKEN_TTL_SEC: "900"
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        PrecheckPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: POST
        PrecheckOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: OPTIONS

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: createCheckout.handler
      Environment:
        Variables:
          STRIPE_MODE: !Ref StripeMode
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          STRIPE_TEST_SECRET_KEY_PARAM: !Ref StripeTestSecretKeyParamName
          STRIPE_PRICE_ID_PARAM: !Ref StripePriceIdParamName
          STRIPE_PRICE_ID_REPORT_PARAM: !Ref StripeReportPriceIdParamName
          STRIPE_PRICE_ID_SCAN_PARAM: !Ref StripeScanPriceIdParamName
          STRIPE_PRICE_ID_PROTECT_PARAM: !Ref StripeProtectPriceIdParamName
          STRIPE_ADDON_REWRITE_PRICE_PARAM: !Ref StripeAddonRewritePriceIdParamName
          STRIPE_ADDON_UPDATE_EMAIL_PRICE_PARAM: !Ref StripeAddonUpdateEmailPriceIdParamName
          STRIPE_TEST_PRICE_ID_REPORT_PARAM: !Ref StripeTestReportPriceIdParamName
          STRIPE_TEST_PRICE_ID_SCAN_PARAM: !Ref StripeTestScanPriceIdParamName
          STRIPE_TEST_PRICE_ID_PROTECT_PARAM: !Ref StripeTestProtectPriceIdParamName
          STRIPE_TEST_ADDON_REWRITE_PRICE_PARAM: !Ref StripeTestAddonRewritePriceIdParamName
          STRIPE_TEST_ADDON_UPDATE_EMAIL_PRICE_PARAM: !Ref StripeTestAddonUpdateEmailPriceIdParamName
          APP_BASE_URL: !Ref AppBaseUrl
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
          RESULTS_TABLE: !Ref ResultsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeReportPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeScanPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeProtectPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeAddonRewritePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeAddonUpdateEmailPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestReportPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestScanPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestProtectPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestAddonRewritePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestAddonUpdateEmailPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        CheckoutPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: POST
        CheckoutOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: OPTIONS

  PreviewAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: previewAnalysis.handler
      Timeout: 330
      MemorySize: 512
      ReservedConcurrentExecutions: !If [EnablePreviewReservedConcurrencyCondition, !Ref PreviewMaxConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "30"
          ANALYSIS_TIMEOUT_MS: "300000"
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          ANALYSIS_MODE: !Ref AnalysisMode
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
          DOCUMENT_REVISION_FUNCTION_NAME: !Ref GenerateRevisionFunction
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
        - Statement:
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt GenerateRevisionFunction.Arn
      Events:
        PreviewPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /preview
            Method: POST
        PreviewOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /preview
            Method: OPTIONS

  VerifyCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: verifyCheckout.handler
      Timeout: 330
      MemorySize: 512
      Environment:
        Variables:
          STRIPE_MODE: !Ref StripeMode
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          STRIPE_TEST_SECRET_KEY_PARAM: !Ref StripeTestSecretKeyParamName
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "30"
          ANALYSIS_TIMEOUT_MS: "300000"
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          ANALYSIS_MODE: !Ref AnalysisMode
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
          DOCUMENT_REVISION_FUNCTION_NAME: !Ref GenerateRevisionFunction
          APP_BASE_URL: !Ref AppBaseUrl
          RESEND_API_KEY_PARAM: !Ref ResendApiKeyParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeTestSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ResendApiKeyParamName}
        - Statement:
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt GenerateRevisionFunction.Arn
      Events:
        CheckoutVerifyPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: POST
        CheckoutVerifyOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: OPTIONS

  GenerateRevisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: generateRevision.handler
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: getResult.handler
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "30"
          DOCUMENT_REVISION_FUNCTION_NAME: !Ref GenerateRevisionFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt GenerateRevisionFunction.Arn
      Events:
        GetResultGet:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: GET
        GetResultOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: OPTIONS

  SubmitFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: submitFeedback.handler
      Environment:
        Variables:
          FEEDBACK_TABLE:     !Ref FeedbackTable
          TESTIMONIALS_TABLE: !Ref TestimonialsTable
          RESULTS_TABLE:      !Ref ResultsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestimonialsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
      Events:
        SubmitFeedbackPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /feedback
            Method: POST
        SubmitFeedbackOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /feedback
            Method: OPTIONS

Outputs:
  ApiUrl:
