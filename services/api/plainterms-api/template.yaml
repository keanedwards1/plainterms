AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PlainTerms API

Parameters:
  AppBaseUrl:
    Type: String
    Default: https://plainterms.vercel.app
    Description: Frontend base URL used for Stripe success/cancel redirects.
  StripeSecretKeyParamName:
    Type: String
    Default: /plainterms/stripe/secret-key
    Description: SSM parameter name containing Stripe secret key (SecureString).
  StripePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: Legacy fallback SSM parameter name containing Stripe price ID (String).
  StripeReportPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe report tier price ID (String).
  StripeScanPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe scan tier price ID (String).
  StripeProtectPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe protect tier price ID (String).
  StripeAddonRewritePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe add-on price ID for rewrite contract (String).
  StripeAddonUpdateEmailPriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe add-on price ID for update email draft (String).
  AnalysisMode:
    Type: String
    Default: rules
    AllowedValues:
      - rules
      - llm
    Description: Contract analysis mode.
  LlmModel:
    Type: String
    Default: gpt-4o-mini
    AllowedValues:
      - gpt-4o-mini
      - gpt-5-mini
      - gpt-5
      - gpt-5.2
    Description: LLM model to use when AnalysisMode is llm.
  LlmApiKeyParamName:
    Type: String
    Default: /plainterms/llm/api-key
    Description: SSM parameter name containing LLM API key (SecureString).
  PrecheckTokenSecretParamName:
    Type: String
    Default: /plainterms/precheck/token-secret
    Description: SSM parameter name used to sign/verify precheck tokens (SecureString).
  ApiDefaultRateLimit:
    Type: Number
    Default: 10
    Description: API Gateway stage-level steady-state requests per second.
  ApiDefaultBurstLimit:
    Type: Number
    Default: 20
    Description: API Gateway stage-level burst request limit.
  WafGlobalIpLimitPer5Min:
    Type: Number
    Default: 1500
    Description: WAF per-IP request cap over 5 minutes across all routes.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AppBaseUrl

Resources:
  PlainTermsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: !Sub "'${AppBaseUrl}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ApiDefaultRateLimit
          ThrottlingBurstLimit: !Ref ApiDefaultBurstLimit

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AppBaseUrl
            AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 30

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsResults
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: result_id
          AttributeType: S
      KeySchema:
        - AttributeName: result_id
          KeyType: HASH

  PlainTermsApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-plainterms-api-webacl"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-plainterms-api-webacl"
        SampledRequestsEnabled: true
      Rules:
        - Name: ip-rate-limit-global
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref WafGlobalIpLimitPer5Min
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-ip-rate-limit-global"
            SampledRequestsEnabled: true

  PlainTermsApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${PlainTermsApi}/stages/Prod
      WebACLArn: !GetAtt PlainTermsApiWebAcl.Arn

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: uploadUrl.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrlPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: POST
        UploadUrlOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: OPTIONS

  PrecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: precheckUpload.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          PRECHECK_MIN_WORDS: "5"
          PRECHECK_TOKEN_TTL_SEC: "900"
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        PrecheckPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: POST
        PrecheckOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: OPTIONS

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: createCheckout.handler
      Environment:
        Variables:
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          STRIPE_PRICE_ID_PARAM: !Ref StripePriceIdParamName
          STRIPE_PRICE_ID_REPORT_PARAM: !Ref StripeReportPriceIdParamName
          STRIPE_PRICE_ID_SCAN_PARAM: !Ref StripeScanPriceIdParamName
          STRIPE_PRICE_ID_PROTECT_PARAM: !Ref StripeProtectPriceIdParamName
          STRIPE_ADDON_REWRITE_PRICE_PARAM: !Ref StripeAddonRewritePriceIdParamName
          STRIPE_ADDON_UPDATE_EMAIL_PRICE_PARAM: !Ref StripeAddonUpdateEmailPriceIdParamName
          APP_BASE_URL: !Ref AppBaseUrl
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeReportPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeScanPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeProtectPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeAddonRewritePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeAddonUpdateEmailPriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        CheckoutPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: POST
        CheckoutOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: OPTIONS

  VerifyCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: verifyCheckout.handler
      Timeout: 330
      MemorySize: 512
      Environment:
        Variables:
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "30"
          ANALYSIS_TIMEOUT_MS: "300000"
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          ANALYSIS_MODE: !Ref AnalysisMode
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}
      Events:
        CheckoutVerifyPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: POST
        CheckoutVerifyOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: OPTIONS

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: getResult.handler
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "30"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
      Events:
        GetResultGet:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: GET
        GetResultOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: OPTIONS

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PlainTermsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
