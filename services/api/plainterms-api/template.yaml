AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PlainTerms API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Resources:
  PlainTermsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: "'*'"

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 1

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: uploadUrl.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: POST

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: analyze.handler
      Events:
        Analyze:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /analyze
            Method: POST

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: getResult.handler
      Events:
        GetResult:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PlainTermsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
