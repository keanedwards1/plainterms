AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PlainTerms API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Resources:
  PlainTermsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: "'*'"

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "https://plainterms.vercel.app"
            AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 1

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsResults
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: result_id
          AttributeType: S
      KeySchema:
        - AttributeName: result_id
          KeyType: HASH

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: uploadUrl.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrlPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: POST
        UploadUrlOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: OPTIONS

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: analyze.handler
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
      Events:
        AnalyzePost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /analyze
            Method: POST
        AnalyzeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /analyze
            Method: OPTIONS

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: getResult.handler
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
      Events:
        GetResultGet:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: GET
        GetResultOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: OPTIONS

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PlainTermsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
