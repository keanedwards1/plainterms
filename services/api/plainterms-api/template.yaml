AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PlainTerms API

Parameters:
  AppBaseUrl:
    Type: String
    Default: https://plainterms.vercel.app
    Description: Frontend base URL used for Stripe success/cancel redirects.
  StripeSecretKeyParamName:
    Type: String
    Default: /plainterms/stripe/secret-key
    Description: SSM parameter name containing Stripe secret key (SecureString).
  StripePriceIdParamName:
    Type: String
    Default: /plainterms/stripe/price-id
    Description: SSM parameter name containing Stripe price ID (String).
  AnalysisMode:
    Type: String
    Default: rules
    AllowedValues:
      - rules
      - llm
    Description: Contract analysis mode.
  LlmModel:
    Type: String
    Default: gpt-4o-mini
    AllowedValues:
      - gpt-4o-mini
      - gpt-5-mini
      - gpt-5
      - gpt-5.2
    Description: LLM model to use when AnalysisMode is llm.
  LlmApiKeyParamName:
    Type: String
    Default: /plainterms/llm/api-key
    Description: SSM parameter name containing LLM API key (SecureString).
  PrecheckTokenSecretParamName:
    Type: String
    Default: /plainterms/precheck/token-secret
    Description: SSM parameter name used to sign/verify precheck tokens (SecureString).

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Resources:
  PlainTermsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: "'*'"

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "https://plainterms.vercel.app"
            AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 1

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlainTermsResults
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: result_id
          AttributeType: S
      KeySchema:
        - AttributeName: result_id
          KeyType: HASH

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: uploadUrl.handler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrlPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: POST
        UploadUrlOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /upload-url
            Method: OPTIONS

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: analyze.handler
      Timeout: 45
      MemorySize: 512
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "7"
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          ANALYSIS_MODE: !Ref AnalysisMode
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}
      Events:
        AnalyzePost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /analyze
            Method: POST
        AnalyzeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /analyze
            Method: OPTIONS

  PrecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: precheckUpload.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          PRECHECK_MIN_WORDS: "5"
          PRECHECK_TOKEN_TTL_SEC: "900"
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        PrecheckPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: POST
        PrecheckOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /precheck
            Method: OPTIONS

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: createCheckout.handler
      Environment:
        Variables:
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          STRIPE_PRICE_ID_PARAM: !Ref StripePriceIdParamName
          APP_BASE_URL: !Ref AppBaseUrl
          PRECHECK_TOKEN_SECRET_PARAM: !Ref PrecheckTokenSecretParamName
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripePriceIdParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrecheckTokenSecretParamName}
      Events:
        CheckoutPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: POST
        CheckoutOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout
            Method: OPTIONS

  VerifyCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: verifyCheckout.handler
      Timeout: 45
      MemorySize: 512
      Environment:
        Variables:
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParamName
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "7"
          UPLOAD_BUCKET: !Ref UploadBucket
          UPLOAD_MAX_BYTES: "26214400"
          ANALYSIS_MODE: !Ref AnalysisMode
          LLM_BASE_URL: "https://api.openai.com/v1"
          LLM_MODEL: !Ref LlmModel
          LLM_API_KEY_PARAM: !Ref LlmApiKeyParamName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParamName}
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParamName}
      Events:
        CheckoutVerifyPost:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: POST
        CheckoutVerifyOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /checkout/verify
            Method: OPTIONS

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: getResult.handler
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_DAYS: "7"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
      Events:
        GetResultGet:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: GET
        GetResultOptions:
          Type: Api
          Properties:
            RestApiId: !Ref PlainTermsApi
            Path: /result/{id}
            Method: OPTIONS

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${PlainTermsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
