# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "plainterms-api"
region = "us-west-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "plainterms-api"
image_repositories = []
parameter_overrides = "AppBaseUrl=\"https://www.plainterms.us\" AppSecondaryBaseUrl=\"https://plainterms.us\" StripeSecretKeyParamName=\"/plainterms/stripe/secret-key\" StripeTestSecretKeyParamName=\"/plainterms/stripe/test/secret-key\" StripePriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeReportPriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeScanPriceIdParamName=\"/plainterms/stripe/price-id-scan\" StripeProtectPriceIdParamName=\"/plainterms/stripe/price-id-protect\" StripeAddonRewritePriceIdParamName=\"/plainterms/stripe/price-id\" StripeAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/price-id\" StripeTestReportPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestScanPriceIdParamName=\"/plainterms/stripe/test/price-id-scan\" StripeTestProtectPriceIdParamName=\"/plainterms/stripe/test/price-id-protect\" StripeTestAddonRewritePriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" AnalysisMode=\"rules\" LlmModel=\"gpt-4o-mini\" LlmApiKeyParamName=\"/plainterms/llm/api-key\" PrecheckTokenSecretParamName=\"/plainterms/precheck/token-secret\" EnableApiWaf=\"false\" ApiDefaultRateLimit=\"5\" ApiDefaultBurstLimit=\"10\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
