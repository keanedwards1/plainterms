# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "plainterms-api"
region = "us-west-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "plainterms-api"
image_repositories = []
parameter_overrides = "WorkosClientId=\"client_01M8B5M5QFFCK6Y8A6ZEGA8BE3\" AppBaseUrl=\"https://www.plainterms.us\" AppSecondaryBaseUrl=\"https://plainterms.us\" StripeSecretKeyParamName=\"/plainterms/stripe/secret-key\" StripeTestSecretKeyParamName=\"/plainterms/stripe/test/secret-key\" StripePriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeReportPriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeScanPriceIdParamName=\"/plainterms/stripe/price-id-scan\" StripeProtectPriceIdParamName=\"/plainterms/stripe/price-id-protect\" StripeAddonRewritePriceIdParamName=\"/plainterms/stripe/price-id\" StripeAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/price-id\" StripeTestReportPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestScanPriceIdParamName=\"/plainterms/stripe/test/price-id-scan\" StripeTestProtectPriceIdParamName=\"/plainterms/stripe/test/price-id-protect\" StripeTestAddonRewritePriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" AnalysisMode=\"rules\" LlmModel=\"gpt-4o-mini\" LlmApiKeyParamName=\"/plainterms/llm/api-key\" PrecheckTokenSecretParamName=\"/plainterms/precheck/token-secret\" EnableApiWaf=\"false\" ApiDefaultRateLimit=\"5\" ApiDefaultBurstLimit=\"10\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Staging: a separate stack in the same account for testing. Always Stripe
# sandbox, stack-specific tables, no alarms. Deploy with: npm run deploy:staging
[staging.global.parameters]
stack_name = "plainterms-api-staging"
region = "us-west-2"

[staging.build.parameters]
cached = true
parallel = true

[staging.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "plainterms-api-staging"
image_repositories = []
parameter_overrides = "EnvironmentName=\"staging\" StripeMode=\"sandbox\" WorkosClientId=\"client_01M87S9Y7XTMJF24V10RRVBRE4\" AppBaseUrl=\"http://localhost:3000\" AppSecondaryBaseUrl=\"http://127.0.0.1:3000\" StripeSecretKeyParamName=\"/plainterms/stripe/secret-key\" StripeTestSecretKeyParamName=\"/plainterms/stripe/test/secret-key\" StripePriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeReportPriceIdParamName=\"/plainterms/stripe/price-id-report\" StripeScanPriceIdParamName=\"/plainterms/stripe/price-id-scan\" StripeProtectPriceIdParamName=\"/plainterms/stripe/price-id-protect\" StripeAddonRewritePriceIdParamName=\"/plainterms/stripe/price-id\" StripeAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/price-id\" StripeTestReportPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestScanPriceIdParamName=\"/plainterms/stripe/test/price-id-scan\" StripeTestProtectPriceIdParamName=\"/plainterms/stripe/test/price-id-protect\" StripeTestAddonRewritePriceIdParamName=\"/plainterms/stripe/test/price-id-report\" StripeTestAddonUpdateEmailPriceIdParamName=\"/plainterms/stripe/test/price-id-report\" AnalysisMode=\"rules\" LlmModel=\"gpt-4o-mini\" LlmApiKeyParamName=\"/plainterms/llm/api-key\" PrecheckTokenSecretParamName=\"/plainterms/precheck/token-secret\" EnableApiWaf=\"false\" ApiDefaultRateLimit=\"5\" ApiDefaultBurstLimit=\"10\""
